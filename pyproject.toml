[project]
name = "aloha-support-bot"
version = "0.1.0"
description = "Bot de soporte interno de Aloha (@support-bot): entrada de chat hacia los agentes de cada producto"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "boto3>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
